<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanime Crawler</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="hamburger" id="hamburgerBtn" type="button" aria-label="菜单">☰</button>
    <button class="brand" id="brandBtn" type="button">Hanime<span>Viewer</span></button>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索视频标题 / code…" maxlength="100">
      <select id="sortSelect" aria-label="排序">
        <option value="">最新上市</option>
        <option value="最新上傳">最新上傳</option>
        <option value="本日排行">本日排行</option>
        <option value="本週排行">本週排行</option>
        <option value="本月排行">本月排行</option>
        <option value="觀看次數">觀看次數</option>
        <option value="讚好比例">讚好比例</option>
        <option value="他們在看">他們在看</option>
        <option value="時長最長">時長最長</option>
      </select>
      <button id="searchBtn" type="button">搜索</button>
      <button id="previewBtn" type="button" class="ghost-btn">新番預告</button>
    </div>
    <span class="top-actions">
      <button id="navBackBtn" type="button" class="ghost-btn" disabled>撤回</button>
      <button id="downloadsBtn" type="button" class="ghost-btn">下載</button>
    </span>
  </div>
</header>

<!-- 左侧可滑出滑入侧边栏：統計 / CSV / JSON -->
<div class="sidebar-overlay hidden" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar" aria-hidden="true">
  <div class="sidebar-head">菜单</div>
  <div class="sidebar-body">
    <button class="side-btn" id="sStatsBtn" type="button">統計</button>
    <a class="side-btn" id="sExportCsv" href="/api/export?fmt=csv" download>導出 CSV</a>
    <a class="side-btn" id="sExportJson" href="/api/export?fmt=json" download>導出 JSON</a>
  </div>
</aside>

<main class="content">
  <div id="errorBar" class="error-bar hidden"></div>
  <div id="view"></div>
</main>

<footer class="footer">
  hanime-crawler · 本地研究工具 · 遵守 PLAN 合规边界
</footer>

<script src="/static/app.js"></script>
</body>
</html>
